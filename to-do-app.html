<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow Pro | Smart To-Do App</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="todo-style.css" />
  </head>
  <body>
    <div class="app">
      <div class="app-header">
        <div class="app-header-inner">
          <h1><i class="fas fa-check-double"></i> TaskFlow Pro</h1>
          <p>Organize your day, achieve your goals.</p>
          <div class="progress-box">
            <div class="progress-text">
              <span id="progressLabel">0 of 0 completed</span>
              <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-box">
          <input
            type="text"
            id="taskInput"
            placeholder="What needs to be done?"
            maxlength="80"
            autocomplete="off"
          />
          <button id="addBtn" title="Add task" aria-label="Add task">
            <i class="fas fa-plus"></i>
          </button>
        </div>
      </div>

      <div class="filters">
        <button class="filter active" data-filter="all">
          All <span class="count" id="countAll">0</span>
        </button>
        <button class="filter" data-filter="active">
          Active <span class="count" id="countActive">0</span>
        </button>
        <button class="filter" data-filter="completed">
          Done <span class="count" id="countCompleted">0</span>
        </button>
      </div>

      <div class="tasks" id="taskList"></div>

      <div class="app-footer">
        <span id="taskCount"><strong>0</strong> tasks left</span>
        <button class="clear-btn" id="clearBtn">
          <i class="fas fa-trash"></i> Clear Completed
        </button>
      </div>
    </div>

    <script src="todo-script.js"></script>
  </body>
</html>
